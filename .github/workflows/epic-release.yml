name: Reviewed Epic Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release only through the reviewed epic PR path.
        type: choice
        options: [reviewed]
        required: true
      tag:
        description: Existing v-prefixed release tag at the merged PR commit.
        type: string
        required: true
      reviewed_pr:
        description: Positive canonical PR number. The legacy default 0 is rejected.
        type: string
        default: '0'
        required: true
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      reviewed_pr: ${{ steps.validate.outputs.reviewed_pr }}
    steps:
      - name: Validate reviewed epic dispatch inputs
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          REVIEWED_PR: ${{ inputs.reviewed_pr }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" ]] || {
            echo "release must be dispatched" >&2
            exit 2
          }
          [[ "$REPOSITORY" == "tinyhumansai/tinychannels" ]] || {
            echo "release caller is not the canonical TinyChannels repository" >&2
            exit 2
          }
          [[ "$REF" == "refs/heads/epic/8056-modules-wiring" ]] || {
            echo "release must run from epic/8056-modules-wiring" >&2
            exit 2
          }
          [[ "$RELEASE_MODE" == "reviewed" ]] || {
            echo "release mode must be reviewed" >&2
            exit 2
          }
          [[ "$REVIEWED_PR" =~ ^[1-9][0-9]*$ ]] || {
            echo "reviewed_pr must be a positive integer" >&2
            exit 2
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "tag must be v-prefixed semver" >&2
            exit 2
          }
          printf 'tag=%s\nversion=%s\nreviewed_pr=%s\n' \
            "$RELEASE_TAG" "${RELEASE_TAG#v}" "$REVIEWED_PR" >> "$GITHUB_OUTPUT"
  release:
    needs: validate
    permissions:
      contents: write
      pull-requests: read
      checks: read
      actions: read
    uses: tinyhumansai/.github/.github/workflows/module-reviewed-epic-release.yml@d463b7d93a3d6ea618e46365dffcf34ecc898462
    with:
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      reviewed-pr: ${{ fromJSON(needs.validate.outputs.reviewed_pr || '0') }}
