[package]
rust-version = "1.94"
name = "tinychannels-client"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
description = "Typed host calls to the TinyChannels TinyBus module."
repository = "https://github.com/tinyhumansai/tinychannels"
publish = false

[dependencies]
tinybus = { workspace = true }
tinychannels-bus = { path = "../tinychannels-bus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
async-trait = "0.1"
tinybus = { workspace = true, features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
